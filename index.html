<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinner Menu Recommendation</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div id="theme-toggle">
    <button id="toggle-btn" onclick="toggleTheme()">Dark Mode</button>
  </div>

  <section id="main-content">
    <h1>🍽️ What's for Dinner?</h1>
    <div id="menu-display">
      <p id="menu-text">Click the button for a recommendation!</p>
      <div id="image-container" style="display: none; margin-top: 20px;">
        <img id="menu-image" src="" alt="Menu Image" style="max-width: 100%; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
      </div>
    </div>
    <button id="recommend-btn" onclick="recommendMenu()">Recommend Menu</button>
  </section>

  <hr style="width: 80%; margin: 50px auto; border: 0.5px solid var(--card-bg);">

  <section id="partnership">
    <h2>🤝 Partnership Inquiry</h2>
    <p>Interested in collaborating with us? Send us a message!</p>
    <div id="form-container">
      <form action="https://formspree.io/f/mwvwegdr" method="POST">
        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message:</label>
          <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <hr style="width: 80%; margin: 50px auto; border: 0.5px solid var(--card-bg);">

  <section id="comments">
    <h2>💬 Comments</h2>
    <div id="disqus_thread"></div>
    <script>
        /**
        *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
        *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

        this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
        };

        var d = document, s = d.createElement('script');
        s.src = 'https://https-jaehuntest1-pages-dev.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  </section>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
